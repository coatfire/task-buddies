<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Nunito';
    font-weight: 800;
    src: url('../../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Nunito';
    font-weight: 700;
    src: url('../../node_modules/@fontsource/nunito/files/nunito-latin-700-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans';
    font-weight: 500;
    src: url('../../node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2') format('woff2');
  }

  :root {
    --w: 1290px;
    --h: 2796px;
    --bg: #FAF3E8;
    --ink: #4A3426;
    --muted: #8A7560;
    --phone-w: 1010px;
    --phone-top: 700px;
    --bezel: 34px;
    --radius: 118px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body {
    background: var(--bg);
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--ink);
    position: relative;
  }

  /* soft glow like the app background */
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.15) 35%, transparent 70%),
      radial-gradient(ellipse at 50% 100%, rgba(74,52,38,0.10) 0%, transparent 60%);
    pointer-events: none;
  }

  .copy {
    position: absolute;
    top: 170px; left: 90px; right: 90px;
    height: calc(var(--phone-top) - 170px - 40px);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 36px;
    text-align: center;
  }
  .headline {
    font-weight: 800;
    font-size: 112px;
    line-height: 1.08;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .sub {
    max-width: 1000px;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 500;
    font-size: 44px;
    line-height: 1.3;
    color: var(--muted);
    text-wrap: balance;
  }
  .sub:empty { display: none; }

  .phone {
    position: absolute;
    left: 50%;
    top: var(--phone-top);
    transform: translateX(-50%);
    width: var(--phone-w);
    padding: var(--bezel);
    background: #2B211C;
    border-radius: var(--radius);
    box-shadow:
      0 60px 120px -30px rgba(74,52,38,0.45),
      0 20px 40px -20px rgba(74,52,38,0.30),
      inset 0 0 0 4px rgba(255,255,255,0.06);
  }
  .screen {
    position: relative;
    width: 100%;
    border-radius: calc(var(--radius) - var(--bezel));
    overflow: hidden;
    background: #FAF3E8;
    aspect-ratio: 390 / 844;
  }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* fake status bar so the capture looks like a real phone */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 96px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 76px;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 500; font-size: 36px; color: var(--ink);
    pointer-events: none;
  }
  .statusbar .icons { display: flex; gap: 14px; align-items: center; }
  .statusbar svg { width: 40px; height: 32px; fill: var(--ink); }
  .island {
    position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
    width: 280px; height: 76px; border-radius: 40px; background: #2B211C;
  }

  /* phone-less hero: buddies scattered on the tint */
  .buddies { position: absolute; inset: 0; display: none; }
  body.layout-buddies .phone { display: none; }
  body.layout-buddies .buddies { display: block; }
  body.layout-buddies .copy { top: 240px; height: 560px; }
  .buddy {
    position: absolute;
    width: 128px; height: 128px;
    background-repeat: no-repeat;
    background-size: 400% 400%;   /* 4x4 sprite sheet */
    background-position: 0 0;     /* frame 0 */
    transform-origin: center;
    image-rendering: auto;
    filter: drop-shadow(0 30px 40px rgba(74,52,38,0.22));
  }
  .blob {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.55);
    box-shadow: 0 40px 80px -30px rgba(74,52,38,0.25);
  }

  /* iPad 13" store poster: 2064x2752 canvas, iPad Pro 11" screen, no Dynamic Island. Whole device stays in frame. */
  body.device-ipad {
    --w: 2064px;
    --h: 2752px;
    --phone-w: 1400px;
    --phone-top: 640px;
    --bezel: 40px;
    --radius: 96px;
  }
  body.device-ipad .copy { top: 110px; left: 140px; right: 140px; gap: 32px; }
  body.device-ipad .headline { font-size: 150px; }
  body.device-ipad .sub { max-width: 1600px; font-size: 62px; }
  body.device-ipad .screen { aspect-ratio: 834 / 1194; }
  body.device-ipad .island { display: none; }
  body.device-ipad .statusbar { height: 44px; padding: 0 48px; font-size: 26px; }
  body.device-ipad .statusbar svg { width: 30px; height: 24px; }

  /* Status bar variants: iOS by default, Android when body has .frame-android */
  .time-android, .icons-android { display: none !important; }
  body.frame-android .time-ios, body.frame-android .icons-ios { display: none !important; }
  body.frame-android .time-android { display: inline !important; }
  body.frame-android .icons-android { display: flex !important; }

  /* Android phone frame: slimmer bezel, tighter corners, centred punch-hole camera,
     Material-style status bar. No Dynamic Island. */
  body.frame-android {
    --bezel: 22px;
    --radius: 84px;
  }
  body.frame-android .screen { border-radius: calc(var(--radius) - var(--bezel)); }
  body.frame-android .island {
    width: 40px; height: 40px; top: 26px; border-radius: 50%;
    background: #1a1411;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.05);
  }
  body.frame-android .statusbar { height: 92px; padding: 0 64px; font-size: 32px; font-weight: 500; }
  body.frame-android .statusbar .icons { gap: 10px; }
  body.frame-android .statusbar svg { width: 32px; height: 32px; }

  /* Mockup mode (social pack): just the device on a transparent canvas, no copy or tint. */
  body.layout-mockup { background: transparent; }
  body.layout-mockup .glow, body.layout-mockup .copy { display: none; }
  body.layout-mockup .phone { top: 80px; box-shadow: 0 40px 80px -30px rgba(74,52,38,0.35); }

  /* per-poster tints */
  body.tint-peach  { --bg: #F6D9C4; }
  body.tint-sage   { --bg: #DCE5D2; }
  body.tint-sky    { --bg: #D8E6EC; }
  body.tint-lilac  { --bg: #E3DCF2; }
  body.tint-sand   { --bg: #F0E4CC; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <h1 class="headline" id="headline"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="buddies" id="buddies"></div>
  <div class="phone">
    <div class="screen">
      <img id="shot" alt="" />
      <div class="statusbar">
        <span class="time-ios">9:41</span>
        <span class="time-android">9:30</span>
        <span class="icons icons-ios">
          <svg viewBox="0 0 40 32"><rect x="2" y="20" width="6" height="10" rx="1.5"/><rect x="11" y="14" width="6" height="16" rx="1.5"/><rect x="20" y="8" width="6" height="22" rx="1.5"/><rect x="29" y="2" width="6" height="28" rx="1.5"/></svg>
          <svg viewBox="0 0 40 32"><path d="M20 26a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm-9.9-7.4 3.5 3.5a9 9 0 0 1 12.8 0l3.5-3.5a14 14 0 0 0-19.8 0zM3 11.9l3.5 3.5a19 19 0 0 1 27 0l3.5-3.5a24 24 0 0 0-34 0z"/></svg>
          <svg viewBox="0 0 40 32"><rect x="1" y="6" width="32" height="20" rx="5" fill="none" stroke="#4A3426" stroke-width="3"/><rect x="35" y="12" width="4" height="8" rx="1.5"/><rect x="4" y="9" width="26" height="14" rx="3"/></svg>
        </span>
        <!-- Material-style wifi, cellular and battery glyphs -->
        <span class="icons icons-android">
          <svg viewBox="0 0 24 24"><path d="M12 21 0 6.5C3.4 3.9 7.5 2.5 12 2.5s8.6 1.4 12 4L12 21z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </span>
      </div>
      <div class="island"></div>
    </div>
  </div>
</body>
</html>
